{% extends "base.html" %}
{% block title %}Login | NoteShare{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 420px;">
    <div class="ns-auth-card p-4">
        <div class="text-center mb-4">
            <span class="ns-brand fs-4"><i class="bi bi-layers-fill"></i> NoteShare</span>
            <h5 class="mt-2 fw-bold">Welcome back</h5>
            <p class="text-muted small">Log in to upload, rate, and review notes.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="ns-label">Username</label>
                <input type="text" name="username" class="form-control ns-input" placeholder="your_username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="ns-label">Password</label>
                <input type="password" name="password" class="form-control ns-input" placeholder="••••••••" required>
            </div>
            <button class="btn ns-btn-primary w-100 fw-bold">Login</button>
        </form>
        <p class="text-center mt-3 small text-muted">
            No account? <a href="/register" class="ns-link">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
