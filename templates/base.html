<!DOCTYPE html>
<html lang="en">
<head>
    <title>NoteShare</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar ns-nav px-3 py-2 d-flex justify-content-between align-items-center">

    <!-- <a href="/" class="ns-brand">📘 NoteShare</a> -->

    <!-- <form method="GET" class="d-flex ns-search">
        <input type="text" name="search" value="{{ search_query }}" placeholder="Search notes..." class="form-control">
        <button class="ns-btn-search">Search</button>
    </form> -->

    <div class="d-flex align-items-center gap-2">
        {% if session.username %}
            <div class="ns-user-badge">{{ session.username[0] }}</div>
            <a href="/my-notes" class="ns-btn-ghost">My Notes</a>
            <!-- <a href="/logout" class="ns-btn-primary">Logout</a> -->
        <!-- {% else %}
            <a href="/login" class="ns-btn-ghost">Login</a>
            <a href="/register" class="ns-btn-primary">Register</a>
        {% endif %} -->
    </div>

</nav>

<!-- MAIN -->
<div class="container py-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} ns-alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
