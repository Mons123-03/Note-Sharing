{% extends "base.html" %}
{% block title %}Register | NoteShare{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 420px;">
    <div class="ns-auth-card p-4">
        <div class="text-center mb-4">
            <span class="ns-brand fs-4"><i class="bi bi-layers-fill"></i> NoteShare</span>
            <h5 class="mt-2 fw-bold">Create an account</h5>
            <p class="text-muted small">Join the community of student note-sharers.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="ns-label">Username</label>
                <input type="text" name="username" class="form-control ns-input" placeholder="choose_a_username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="ns-label">Email <span class="text-muted" style="font-weight:400">(optional)</span></label>
                <input type="email" name="email" class="form-control ns-input" placeholder="you@example.com">
            </div>
            <div class="mb-4">
                <label class="ns-label">Password</label>
                <input type="password" name="password" class="form-control ns-input" placeholder="min 8 characters" minlength="8" required>
            </div>
            <button class="btn ns-btn-primary w-100 fw-bold">Create Account</button>
        </form>
        <p class="text-center mt-3 small text-muted">
            Already have an account? <a href="/login" class="ns-link">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
